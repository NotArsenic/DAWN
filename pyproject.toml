[project]
name = "dawn"
version = "0.1.0"
description = "Day thermal to color for drone imagery: flow matching on DINOv3 features, trained on aligned DroneVehicle pairs"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "einops>=0.7",
    "timm>=1.0.20",        # first release with the DINOv3 models
    "peft>=0.12",          # LoRA on the DINO encoder; disable_adapter() gives the L_align target
    "omegaconf>=2.3",
    "Pillow>=10.0",        # JPEG decode, PNG I/O, polygon rasterization, contact sheets
    "numpy>=1.24",
    "scipy>=1.11",
    "matplotlib>=3.7",     # data-phase histograms; dawn.eval.visualize / calibration plots
    "tqdm>=4.65",
    "huggingface-hub>=0.23",  # scripts/fetch_dronevehicle.py pulls the three zips from the Hub
    "wandb>=0.16",
    "lpips>=0.1.4",
    "scikit-image>=0.21",
]

[project.optional-dependencies]
# encoder.backend: transformers (gated facebook/dinov3-* weights; DINOv3 landed in 4.56.0).
transformers = [
    "transformers>=4.56",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
    "black>=23.0",
    "ipython>=8.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dawn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.black]
line-length = 100
target-version = ["py310"]
