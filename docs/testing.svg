<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 1020" width="780" height="1020">
  <style>
    text { font-family: 'CMU Serif', Georgia, 'Times New Roman', serif; fill: #1a1a1a; }
    .title { font-size: 11px; fill: #555; }
    .label { font-size: 12px; text-anchor: middle; }
    .label-sm { font-size: 10px; text-anchor: middle; fill: #444; }
    .label-xs { font-size: 9px; fill: #666; }
    .nx { font-size: 15px; font-weight: 700; }
    .conn-label { font-size: 9.5px; fill: #3b6fb6; font-style: italic; }
    .tower-label { font-size: 11px; fill: #555; font-weight: 600; letter-spacing: 0.5px; text-anchor: middle; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,1 L10,5 L0,9z" fill="#333"/>
    </marker>
    <marker id="ah-g" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,1 L10,5 L0,9z" fill="#999"/>
    </marker>
    <marker id="ah-b" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,1 L10,5 L0,9z" fill="#3b6fb6"/>
    </marker>
    <marker id="ah-t" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,1 L10,5 L0,9z" fill="#2a9d6e"/>
    </marker>
  </defs>

  <rect width="780" height="1020" fill="#fcfcfb"/>

  <!-- ====================================================================== -->
  <!--   TITLE                                                                -->
  <!-- ====================================================================== -->
  <text x="390" y="22" text-anchor="middle" class="title">
    then: unpack &#x2192; brightness grid + a*b* map &#x2192; render in CIELAB &#x2192; daytime RGB
  </text>

  <!-- ====================================================================== -->
  <!--   TOWER LABELS                                                         -->
  <!-- ====================================================================== -->
  <text x="180" y="268" class="tower-label">DINOv3  ViT-S+/16</text>
  <text x="180" y="282" class="label-xs" style="text-anchor:middle">28.7M frozen + LoRA</text>

  <text x="510" y="82" class="tower-label">Velocity Transformer (DiT)</text>
  <text x="510" y="96" class="label-xs" style="text-anchor:middle">7.6M params &#xB7; d=256</text>

  <!-- ====================================================================== -->
  <!--   OUTPUTS (top right)                                                  -->
  <!-- ====================================================================== -->
  <text x="510" y="52" text-anchor="middle" style="font-size:13px; font-weight:600; font-style:italic">velocity v</text>
  <text x="510" y="67" text-anchor="middle" class="label-xs">1280 &#xD7; 48, Euler ODE t : 0 &#x2192; 1  (2 NFE)</text>

  <!-- Arrow up from adaLN final -->
  <line x1="510" y1="73" x2="510" y2="102" stroke="#333" stroke-width="1.3" marker-start="url(#ah)"/>

  <!-- ====================================================================== -->
  <!--   RIGHT TOWER: VELOCITY TRANSFORMER (DiT)                             -->
  <!-- ====================================================================== -->

  <!-- adaLN final -->
  <rect x="395" y="104" width="230" height="34" rx="4" fill="#e8e8e8" stroke="#555" stroke-width="0.8"/>
  <text x="510" y="120" class="label" style="font-size:11px">adaLN final &#xB7; Linear 256 &#x2192; 48</text>
  <text x="510" y="133" class="label-xs" style="text-anchor:middle">zero-initialised</text>

  <line x1="510" y1="138" x2="510" y2="162" stroke="#333" stroke-width="1.3" marker-start="url(#ah)"/>

  <!-- 6x bracket (right side of tower) -->
  <path d="M636,168 L648,168 L648,600 L636,600" stroke="#1a1a1a" stroke-width="1.6" fill="none"/>
  <text x="663" y="390" class="nx">6&#xD7;</text>

  <!-- ===== DiT BLOCK ===== -->

  <!-- GATED RESIDUAL (top, around MLP) -->
  <rect x="395" y="166" width="230" height="26" rx="4" fill="#c4eadc" stroke="#555" stroke-width="0.8"/>
  <text x="510" y="183" class="label" style="font-size:11px">gated residual</text>

  <!-- Skip: MLP bypass (right side curve, AIAYN style) -->
  <path d="M625,192 C632,192 632,192 632,210 L632,298 C632,316 632,316 625,316"
        stroke="#999" stroke-width="0.9" fill="none" marker-end="url(#ah-g)" stroke-dasharray="3,2"/>

  <line x1="510" y1="192" x2="510" y2="210" stroke="#333" stroke-width="1.3" marker-start="url(#ah)"/>

  <!-- MLP -->
  <rect x="395" y="212" width="230" height="36" rx="4" fill="#c8dcf4" stroke="#555" stroke-width="0.8"/>
  <text x="510" y="230" class="label" style="font-size:12px; font-weight:600">MLP</text>
  <text x="510" y="243" class="label-xs" style="text-anchor:middle">GELU &#xB7; 256 &#x2192; 1024 &#x2192; 256</text>

  <line x1="510" y1="248" x2="510" y2="268" stroke="#333" stroke-width="1.3" marker-start="url(#ah)"/>

  <!-- adaLN-Zero (2nd, for MLP) -->
  <rect x="395" y="270" width="230" height="26" rx="4" fill="#c4eadc" stroke="#555" stroke-width="0.8"/>
  <text x="510" y="287" class="label" style="font-size:11px">adaLN-Zero (t)</text>

  <line x1="510" y1="296" x2="510" y2="318" stroke="#333" stroke-width="1.3" marker-start="url(#ah)"/>

  <!-- GATED RESIDUAL (bottom, around Attention) -->
  <rect x="395" y="320" width="230" height="26" rx="4" fill="#c4eadc" stroke="#555" stroke-width="0.8"/>
  <text x="510" y="337" class="label" style="font-size:11px">gated residual</text>

  <!-- Skip: Self-Attention bypass (right side curve) -->
  <path d="M625,346 C632,346 632,346 632,364 L632,452 C632,470 632,470 625,470"
        stroke="#999" stroke-width="0.9" fill="none" marker-end="url(#ah-g)" stroke-dasharray="3,2"/>

  <line x1="510" y1="346" x2="510" y2="368" stroke="#333" stroke-width="1.3" marker-start="url(#ah)"/>

  <!-- Multi-Head Self-Attention (DiT) -->
  <rect x="395" y="370" width="230" height="50" rx="4" fill="#f9d5c6" stroke="#555" stroke-width="0.8"/>
  <text x="510" y="392" class="label" style="font-size:12px; font-weight:600">Multi-Head Self-Attention</text>
  <text x="510" y="408" class="label-sm">4 heads &#xB7; logits += gate &#xB7; log(A + &#x03F5;)</text>

  <line x1="510" y1="420" x2="510" y2="444" stroke="#333" stroke-width="1.3" marker-start="url(#ah)"/>

  <!-- adaLN-Zero (1st, for attention) -->
  <rect x="395" y="446" width="230" height="26" rx="4" fill="#c4eadc" stroke="#555" stroke-width="0.8"/>
  <text x="510" y="463" class="label" style="font-size:11px">adaLN-Zero (t)</text>

  <line x1="510" y1="472" x2="510" y2="498" stroke="#333" stroke-width="1.3" marker-start="url(#ah)"/>

  <!-- ===== END DiT BLOCK ===== -->

  <!-- + circle (combine noisy tokens + conditioning) -->
  <circle cx="510" cy="512" r="13" fill="#fff" stroke="#555" stroke-width="1"/>
  <text x="510" y="517" text-anchor="middle" style="font-size:16px; fill:#555">+</text>

  <line x1="510" y1="525" x2="510" y2="551" stroke="#333" stroke-width="1.3" marker-start="url(#ah)"/>

  <!-- Linear 48 -> 256 -->
  <rect x="395" y="553" width="230" height="32" rx="4" fill="#e8e8e8" stroke="#555" stroke-width="0.8"/>
  <text x="510" y="573" class="label" style="font-size:12px">Linear 48 &#x2192; 256</text>

  <line x1="510" y1="585" x2="510" y2="611" stroke="#333" stroke-width="1.3" marker-start="url(#ah)"/>

  <!-- Noisy tokens input -->
  <text x="510" y="628" text-anchor="middle" style="font-size:13px; font-weight:600; font-style:italic">noisy tokens z<tspan font-size="9" dy="3">t</tspan></text>
  <text x="510" y="647" text-anchor="middle" class="label-xs">1280 &#xD7; 48   (z<tspan font-size="7" dy="2">0</tspan><tspan dy="-2"> ~ N(0, I))</tspan></text>

  <!-- ====================================================================== -->
  <!--   LEFT TOWER: DINOv3 ENCODER                                          -->
  <!-- ====================================================================== -->

  <!-- 12x bracket (left side of tower) -->
  <path d="M60,300 L48,300 L48,600 L60,600" stroke="#1a1a1a" stroke-width="1.6" fill="none"/>
  <text x="35" y="454" class="nx" text-anchor="middle">12&#xD7;</text>

  <!-- Add & Norm (top) -->
  <rect x="70" y="296" width="220" height="28" rx="4" fill="#f9e1ad" stroke="#555" stroke-width="0.8"/>
  <text x="180" y="314" class="label" style="font-size:12px; font-weight:600">Add &amp; Norm</text>

  <!-- Skip: around Gated MLP (right side curve, AIAYN style) -->
  <path d="M290,324 C305,324 305,324 305,340 L305,412 C305,428 305,428 290,428"
        stroke="#999" stroke-width="0.9" fill="none" marker-end="url(#ah-g)" stroke-dasharray="3,2"/>

  <line x1="180" y1="324" x2="180" y2="348" stroke="#333" stroke-width="1.3" marker-start="url(#ah)"/>

  <!-- Gated MLP -->
  <rect x="70" y="350" width="220" height="36" rx="4" fill="#c8dcf4" stroke="#555" stroke-width="0.8"/>
  <text x="180" y="369" class="label" style="font-size:12px; font-weight:600">Gated MLP</text>
  <text x="180" y="382" class="label-xs" style="text-anchor:middle">SwiGLU &#xB7; 384 &#x2192; 1536 &#x2192; 384</text>

  <line x1="180" y1="386" x2="180" y2="412" stroke="#333" stroke-width="1.3" marker-start="url(#ah)"/>

  <!-- Add & Norm (bottom) -->
  <rect x="70" y="414" width="220" height="28" rx="4" fill="#f9e1ad" stroke="#555" stroke-width="0.8"/>
  <text x="180" y="432" class="label" style="font-size:12px; font-weight:600">Add &amp; Norm</text>

  <!-- Skip: around Multi-Head Self-Attention (right side curve) -->
  <path d="M290,442 C305,442 305,442 305,458 L305,530 C305,546 305,546 290,546"
        stroke="#999" stroke-width="0.9" fill="none" marker-end="url(#ah-g)" stroke-dasharray="3,2"/>

  <line x1="180" y1="442" x2="180" y2="470" stroke="#333" stroke-width="1.3" marker-start="url(#ah)"/>

  <!-- Multi-Head Self-Attention (Encoder) -->
  <rect x="70" y="472" width="220" height="46" rx="4" fill="#f9d5c6" stroke="#555" stroke-width="0.8"/>
  <text x="180" y="492" class="label" style="font-size:12px; font-weight:600">Multi-Head Self-Attention</text>
  <text x="180" y="507" class="label-sm">6 heads &#xB7; LoRA r=8 on qkv, proj</text>

  <line x1="180" y1="518" x2="180" y2="542" stroke="#333" stroke-width="1.3" marker-start="url(#ah)"/>

  <!-- + circle (RoPE position) -->
  <circle cx="180" cy="556" r="12" fill="#fff" stroke="#555" stroke-width="1"/>
  <text x="180" y="561" text-anchor="middle" style="font-size:15px; fill:#555">+</text>

  <text x="110" y="549" text-anchor="end" class="label-xs" style="fill:#666">RoPE</text>
  <text x="110" y="562" text-anchor="end" class="label-xs" style="fill:#666">position</text>
  <line x1="113" y1="556" x2="166" y2="556" stroke="#555" stroke-width="0.8" marker-end="url(#ah)"/>

  <line x1="180" y1="568" x2="180" y2="596" stroke="#333" stroke-width="1.3" marker-start="url(#ah)"/>

  <!-- Patch Embedding -->
  <rect x="70" y="598" width="220" height="38" rx="4" fill="#e8e8e8" stroke="#555" stroke-width="0.8"/>
  <text x="180" y="615" class="label" style="font-size:12px; font-weight:600">patch embedding 16 &#xD7; 16</text>
  <text x="180" y="630" class="label-xs" style="text-anchor:middle">&#x2192; 1280 tokens, d=384</text>

  <line x1="180" y1="636" x2="180" y2="664" stroke="#333" stroke-width="1.3" marker-start="url(#ah)"/>

  <!-- Thermal input -->
  <text x="180" y="682" text-anchor="middle" style="font-size:14px; font-weight:600; font-style:italic">thermal frame T</text>
  <text x="180" y="700" text-anchor="middle" class="label-xs">640 &#xD7; 512 &#xD7; 1, normalised to [0, 1]</text>

  <!-- ====================================================================== -->
  <!--   CROSS-CONNECTIONS: Encoder outputs &#x2192; DiT                      -->
  <!-- ====================================================================== -->

  <!-- 1. Patch tokens: encoder top &#x2192; right to + circle -->
  <!--    Route: up from encoder top, right across gap, down to + circle     -->
  <path d="M180,296 L180,250 L350,250 L350,512 L495,512"
        stroke="#3b6fb6" stroke-width="1.5" fill="none" marker-end="url(#ah-b)"/>

  <!-- Label along the horizontal segment -->
  <text x="260" y="242" text-anchor="middle" class="conn-label" style="font-size:10px">patch tokens (1280 &#xD7; 384)</text>
  <text x="347" y="420" class="conn-label" style="font-size:9px; text-anchor:end" transform="rotate(-90,347,420)">+ thermal thumbnail + learned pos</text>

  <!-- 2. Attention bias: encoder's Add&Norm &#x2192; DiT Self-Attention -->
  <path d="M290,432 L340,432 L340,395 L393,395"
        stroke="#3b6fb6" stroke-width="1.3" fill="none" marker-end="url(#ah-b)"/>

  <text x="342" y="378" text-anchor="start" class="conn-label" style="font-size:9.5px">attn bias</text>
  <text x="342" y="390" text-anchor="start" class="conn-label" style="font-size:8.5px">log(A+&#x03F5;), gated</text>

  <!-- ====================================================================== -->
  <!--   TIME CONDITIONING (right side)                                       -->
  <!-- ====================================================================== -->
  <rect x="670" y="430" width="100" height="50" rx="5" fill="#d6f1e7" stroke="#2a9d6e" stroke-width="0.8"/>
  <text x="720" y="450" text-anchor="middle" style="font-size:13px; font-style:italic">t &#x2208; [0, 1]</text>
  <text x="720" y="465" text-anchor="middle" class="label-xs">sinusoidal(256)</text>
  <text x="720" y="477" text-anchor="middle" class="label-xs">&#x2192; SiLU &#xB7; MLP</text>

  <!-- Arrow from time box into the adaLN-Zero (1st, closest) -->
  <line x1="670" y1="459" x2="627" y2="459" stroke="#2a9d6e" stroke-width="1" marker-end="url(#ah-t)"/>

  <!-- Dashed lines to the other adaLN-Zero boxes and adaLN final -->
  <path d="M660,455 L660,283 L627,283" stroke="#2a9d6e" stroke-width="0.8" stroke-dasharray="4,3" fill="none" marker-end="url(#ah-t)"/>
  <path d="M660,455 L660,121 L627,121" stroke="#2a9d6e" stroke-width="0.8" stroke-dasharray="4,3" fill="none" marker-end="url(#ah-t)"/>

  <!-- ====================================================================== -->
  <!--   DASHED BOXES around each tower                                       -->
  <!-- ====================================================================== -->
  <rect x="55" y="288" width="255" height="320" rx="6"
        fill="none" stroke="#b2b3b2" stroke-width="0.8" stroke-dasharray="5,3"/>

  <rect x="385" y="100" width="250" height="510" rx="6"
        fill="none" stroke="#b2b3b2" stroke-width="0.8" stroke-dasharray="5,3"/>

  <!-- ====================================================================== -->
  <!--   LEGEND (bottom)                                                      -->
  <!-- ====================================================================== -->
  <g transform="translate(90, 740)">
    <text x="0" y="0" style="font-size:11px; font-weight:600">Components:</text>

    <rect x="0" y="12" width="18" height="12" rx="2" fill="#f9d5c6" stroke="#555" stroke-width="0.5"/>
    <text x="24" y="22" class="label-xs">Self-Attention</text>

    <rect x="120" y="12" width="18" height="12" rx="2" fill="#c8dcf4" stroke="#555" stroke-width="0.5"/>
    <text x="144" y="22" class="label-xs">Feed-Forward</text>

    <rect x="250" y="12" width="18" height="12" rx="2" fill="#c4eadc" stroke="#555" stroke-width="0.5"/>
    <text x="274" y="22" class="label-xs">Conditioning (adaLN / gate)</text>

    <rect x="440" y="12" width="18" height="12" rx="2" fill="#f9e1ad" stroke="#555" stroke-width="0.5"/>
    <text x="464" y="22" class="label-xs">Normalisation</text>

    <text x="0" y="48" style="font-size:11px; font-weight:600">Arrows:</text>
    <line x1="0" y1="58" x2="30" y2="58" stroke="#333" stroke-width="1.3" marker-end="url(#ah)"/>
    <text x="36" y="62" class="label-xs">Data flow</text>

    <line x1="100" y1="58" x2="130" y2="58" stroke="#999" stroke-width="0.9" stroke-dasharray="3,2" marker-end="url(#ah-g)"/>
    <text x="136" y="62" class="label-xs">Skip connection</text>

    <line x1="240" y1="58" x2="270" y2="58" stroke="#3b6fb6" stroke-width="1.3" marker-end="url(#ah-b)"/>
    <text x="276" y="62" class="label-xs">Cross-tower conditioning</text>

    <line x1="440" y1="58" x2="470" y2="58" stroke="#2a9d6e" stroke-width="1" marker-end="url(#ah-t)"/>
    <text x="476" y="62" class="label-xs">Time embedding</text>
  </g>

  <!-- ====================================================================== -->
  <!--   TRAINING LOSSES (bottom section)                                    -->
  <!-- ====================================================================== -->
  <g transform="translate(90, 840)">
    <text x="0" y="0" style="font-size:11px; font-weight:600">Training losses:</text>
    <text x="0" y="18" class="label-xs" style="font-size:10px">L<tspan font-size="7" dy="2">flow</tspan><tspan dy="-2">   = velocity MSE          (&#xD7;1.0)</tspan></text>
    <text x="0" y="34" class="label-xs" style="font-size:10px">L<tspan font-size="7" dy="2">render</tspan><tspan dy="-2"> = masked L1 in Lab/100   (&#xD7;0.1)</tspan></text>
    <text x="0" y="50" class="label-xs" style="font-size:10px">L<tspan font-size="7" dy="2">align</tspan><tspan dy="-2">  = 1 &#x2212; cos(adapted, frozen DINO)  (&#xD7;0.5)</tspan></text>
    <text x="0" y="66" class="label-xs" style="font-size:10px">L<tspan font-size="7" dy="2">color</tspan><tspan dy="-2">  = CE over 261 a*b* bins   (&#xD7;0.2)</tspan></text>
  </g>

  <!-- ====================================================================== -->
  <!--   PERFORMANCE STATS                                                    -->
  <!-- ====================================================================== -->
  <g transform="translate(410, 840)">
    <text x="0" y="0" style="font-size:11px; font-weight:600">Performance:</text>
    <text x="0" y="18" class="label-xs" style="font-size:10px">40 FPS @ K=8 ensemble samples</text>
    <text x="0" y="34" class="label-xs" style="font-size:10px">20.05 dB L* PSNR &#xB7; 8.31 CIEDE2000</text>
    <text x="0" y="50" class="label-xs" style="font-size:10px">232 GMACs &#xB7; trained on RTX 5090</text>
    <text x="0" y="66" class="label-xs" style="font-size:10px">Euler ODE: 2 NFE (function evaluations)</text>
  </g>

  <!-- Title at very bottom -->
  <text x="390" y="950" text-anchor="middle" style="font-size:14px; font-weight:700; fill:#333">
    Dawn: Day thermal &#x2192; RGB via Flow Matching on DINO-conditioned Tokens
  </text>
  <text x="390" y="970" text-anchor="middle" class="label-xs" style="font-size:9px">
    Token layout: 48 values/token (16 brightness [8 bins &#xD7; gain/offset] + 32 colour [a*b* &#xD7; 4&#xD7;4 block]) &#xB7; 1,280 tokens total
  </text>
</svg>
