# Dataset and degradation configuration.

visdrone:
  # Layout: dawn/data/visdrone.py. Raw images: <root>/VisDrone2019-DET-<split>/{images,annotations}.
  root: data/VisDrone_dataset
  stats_csv: data/stats/visdrone_stats.csv  # prepare_visdrone.py stats: one row per raw image
  labels_csv: data/labels/visdrone_labels.csv  # hand labels (committed): sequence or image -> label
  manifest_dir: data/manifests       # prepare_visdrone.py split: <split>/{day,night,dusk}.txt
  prepared_dir: data/visdrone_512    # prepare_visdrone.py resize: <split>/<image_id>.png
  splits: [train, val, test-dev]
  train_split: train
  val_split: val
  image_size: 512   # long side of the prepared PNG copies
  crop_size: 256    # training crop size
  max_images: null  # cap the dataset size (debug runs)
  box_filter:       # eval-mode boxes; score-0 boxes are always dropped
    drop_categories: [0, 11]  # 0 ignored regions, 11 "others"
    min_size: 16              # px on either side, at the returned resolution

degradation:
  # dawn/data/lighting.py: scene illumination -> night_clean.
  lighting:
    # Exposure reduction.
    exposure_range: [0.01, 0.15]  # LogUniform
    # Spatially-varying illumination field.
    illum_grid_size: 4
    illum_range: [0.4, 1.5]
    # Regimes: moonlit with probability moonlight_prob, otherwise streetlit.
    moonlight_prob: 0.2
    moonlight_temp_range: [3800, 4300]  # Kelvin
    # Streetlit: lamp pools, halos and color temperature.
    num_lights_range: [0, 8]
    light_sigma_range: [20, 150]  # pixels at 512 long-side
    color_temp_range: [2000, 4500]  # Kelvin, sodium to LED
    halo_intensity: 0.02
  # dawn/data/camera.py: sensor noise + ISP -> night.
  camera:
    # Poisson-Gaussian noise, Var[y | x] = a*x + b.
    noise_a_range: [1.0e-4, 5.0e-3]
    noise_b_range: [1.0e-6, 1.0e-4]  # read-noise variance, not std
    # Compression.
    jpeg_quality_range: [70, 95]
