# Stage 1: flow model training for day thermal -> RGB.
# Layouts and conventions: docs/conventions.md

# How the loss code treats the two kinds of aligned pairs (docs/conventions.md section 10.2).
# Decided by the maintainer; dawn/flow/trainer.py reads these keys.
#   box-aligned pairs   aligned from the vehicle boxes; they have a `moving` mask.
#   fallback pairs      aligned by edge correlation only (data/manifests/fallback_pairs.txt); no
#                       `moving` mask, so the `vehicles` mask (every vehicle, dilated) stands in.
pairs:
  fallback_pixel_mask: vehicles     # fallback pairs: mask vehicles in L_flow targets and L_render
  box_pixel_mask: moving            # box-aligned pairs: mask only vehicles that moved
  fallback_render_weight: 0.5       # fallback pairs count half in L_render
  eval_subset: box_aligned          # model selection and headline test metrics on box-aligned only
  report_fallback_separately: true  # fallback val/test reported as a separate robustness number

# Brightness grid: (gain, offset) per cell and thermal-intensity bin, mapping thermal to
# L = L*/100. The cells are the DINO patches, so the cell grid is encoder.input_size / patch_size.
grid:
  num_bins: 8            # thermal-intensity bins (K)
  # Ridge for the target fit (image -> cell -> node), in units of the mean node weight.
  ridge_alpha: 1.0e-3
  # Extra passes that fit the render residual and add it: +0.5 dB of oracle for one more fit.
  refine_steps: 1
  # Normalization stats are computed once and cached, keyed by the token layout and these fit
  # settings (recomputed on a mismatch). A checkpoint embeds the stats it was trained with.
  stats_cache: data/token_stats.pt
  stats_num_samples: 2000

# Colour path: a generated a*b* map at `block` x the token grid (4 x (32, 40) = (128, 160)), brought
# to full size by `upsample`.
color:
  block: 4               # colour pixels per token side
  bin_step: 10           # a*b* bins: the occupied cells of a 10-unit grid over the sRGB gamut (261)
  soft_k: 5              # Zhang et al.: the 5 nearest bins ...
  soft_sigma: 5.0        # ... with a Gaussian of this width (a*b* units)
  min_patch_fraction: 0.5  # L_color ignores patches whose kept (unmasked) share is below this
  # scripts/check_oracle.py also reports the colour ceiling restricted to the top decile of RGB
  # gradient magnitude. The whole-frame mean is dominated by flat asphalt and roofs, so only the
  # edge-restricted number can say whether bilinear bleeds across sharp boundaries.
  edge_quantile: 0.9
  # How the colour map (and the correction) are upsampled: bilinear | bgu. BILINEAR by the
  # maintainer's decision at Checkpoint A: on the real val pairs its colour ceiling is 0.87 mean
  # |delta a*b*| against the BGU's 1.3 (best setting) to 2.1 (16 x 20 cells), and the assembled
  # oracle CIEDE2000 is 3.25 against 3.91 (scripts/check_oracle.py, docs/conventions.md section 6.3).
  upsample: bilinear
  # BGU (only read when upsample is bgu): a bilateral grid of a*b* ~ gain * L + offset fit at the
  # colour size and sliced at the output L. The best setting measured; ridge does not help.
  bgu:
    bins: 8
    grid: [64, 80]       # (rows, cols) of the BGU grid cells: 2 x 2 colour pixels per cell
    ridge_alpha: 1.0e-1
    refine_steps: 2

# A generated L correction at the colour-map size, for what the grid cannot express. OFF until the
# worst-10% oracle sheet and the GPU gate say it is needed (CLAUDE.md, open decisions).
brightness_correction:
  enabled: false

# Encoder: DINOv3 ViT-S+/16 with peft LoRA. One interface, two backends (dawn/models/encoder.py).
encoder:
  backend: timm            # timm | transformers
  model_ids:
    timm: vit_small_plus_patch16_dinov3.lvd1689m                 # needs timm>=1.0.20
    transformers: facebook/dinov3-vits16plus-pretrain-lvd1689m   # gated; needs the `transformers` extra
  patch_size: 16
  # (H, W) of the thermal frame DINO sees. Everything else derives from it: 512 / 16 x 640 / 16 =
  # 32 x 40 = 1,280 patch tokens = brightness cells. A checkpoint is tied to this resolution.
  input_size: [512, 640]
  num_register_tokens: 4   # patch tokens start after CLS + registers (index 1 + 4)
  pretrained: true         # false gives a randomly initialized backbone (offline debug runs)
  grad_checkpointing: true # recompute DINO blocks in the backward pass (16 GB card at 640x512)
  lora_rank: 8
  lora_alpha: 16
  lora_dropout: 0.0
  lora_lr: 1.0e-4
  # peft target_modules per backend: attention qkv + output projection of every block.
  # A string is a regex (full match), a list matches module-name suffixes. The timm regex keeps
  # patch_embed.proj out. Verify the matched names with scripts/smoke_dino.py.
  lora_targets:
    timm: '.*blocks\.\d+\.attn\.(qkv|proj)'
    transformers: [q_proj, k_proj, v_proj, o_proj]

# Velocity transformer. Token width, token count and position embedding come from the token layout.
velocity:
  hidden_dim: 256
  num_heads: 4
  num_blocks: 6
  mlp_ratio: 4
  dropout: 0.0
  # Attention bias from DINO patch-to-patch attention.
  dino_attn_gate_init: 0.0  # learned per block, init at 0
  detach_dino_attn: true    # no gradient into the encoder through the attention bias

# Flow matching.
flow:
  # 20K steps at batch 16 over ~3,660 train pairs is ~90 passes; 40K would be ~175, well into
  # overfitting. Extend only if box-aligned validation is still improving.
  num_train_steps: 20000
  num_inference_steps: 2    # NFE at inference
  timesteps_per_image: 4    # t samples per image per step: one encoder pass feeds 4 velocity passes
  render_size: [256, 320]   # (H, W) where L_render is computed; at least the colour-map size
  # Loss weights.
  velocity_weight: 1.0      # L_flow
  render_weight: 0.1        # L_render: L1 of Lab/100 against the RGB
  align_weight: 0.5         # L_align: adapted (thermal) vs frozen (adapters disabled, RGB) DINO tokens
  color_weight: 0.2         # L_color: per-patch cross-entropy over the 261 a*b* bins
  # Brightness values are weighted by node pixel counts (per cell and bin); colour and correction
  # values by their mask fraction. Each segment is normalized to mean 1 per sample first.
  bin_count_weighting: true
  # How the segments of L_flow are summed. A token is [brightness 16 | colour 32 | correction 16].
  #   per_value    each segment counts in proportion to its number of values (a plain mean over the
  #                token): colour (32) carries twice the weight of brightness (16). The default.
  #   equal        each segment's own mean counts the same.
  # L_flow is logged per segment either way (loss/flow_brightness, _color, _correction).
  segment_balance: per_value
  # The warmup schedule: until this step the encoder's patch tokens and CLS are DETACHED before the
  # velocity net, so LoRA is trained by L_align and L_color alone. After it, everything trains
  # jointly. ~15% of training. This is not the optimizer's LR warmup (optim.lr_warmup_steps).
  warmup_steps: 3000
  # How the conditioning gradient is eased in once the gate above lifts, instead of switching it
  # on between two steps. At step 2,999 the velocity net is fitting a frozen feature distribution
  # that LoRA has been moving under it for 3,000 steps on L_align and L_color; at step 3,000 it
  # would suddenly be fitting a moving one, and LoRA would suddenly be taking a loss it has never
  # seen. The ramp scales that gradient linearly 0 -> 1 over these steps (the FORWARD pass is
  # unchanged either way). 0 is the old hard gate exactly; `null` derives max(1, warmup_steps / 6),
  # so the short overlays scale with their own warmup.
  warmup_ramp_steps: 500
  # Render loss on a random subset of the batch_size x timesteps_per_image samples. null = all.
  # Only a VRAM valve.
  render_subset: null

# Optimization.
optim:
  optimizer: adamw
  lr: 2.0e-4
  weight_decay: 0.01      # not applied to norms, biases, attention gates or the pos embedding
  betas: [0.9, 0.999]
  batch_size: 16          # images per step x flow.timesteps_per_image velocity samples each; 8 if 16 GB is tight
  grad_clip: 1.0
  # bf16 autocast wraps network forwards on CUDA only; on MPS and CPU the run is fp32 whatever this
  # says (bf16 on MPS is patchy: silent slowdowns and errors that have nothing to do with the model).
  precision: bf16         # bf16 | fp32
  ema_decay: 0.999
  # Ramp the EMA decay in from 0.1 as min(ema_decay, (1 + n) / (10 + n)). A fixed 0.999 leaves the
  # shadow 0.999^n initialization: 61% random weights at step 500 and 5% at step 3,000, so every
  # early validation would be measuring the initialization. It only ever LOWERS the decay, so the
  # late-training average is exactly the one ema_decay asks for. false = the old fixed decay.
  ema_warmup: true
  lr_warmup_steps: 1000   # linear LR warmup, then cosine decay over flow.num_train_steps
  # cosine    | the plan's schedule: lr_warmup_steps of linear ramp, then cosine to 0.
  # one_cycle | Smith's one cycle: a long cosine ramp to each group's `lr` as the PEAK, then
  #             cosine down to lr / final_div_factor, with beta1 cycled the other way.
  #             `lr_warmup_steps` is ignored; `one_cycle.pct_start` sets the ramp instead.
  # A one cycle is a FIXED BUDGET: the anneal lands on flow.num_train_steps and most of the gain
  # is in the last low-LR stretch, so do not early-stop one. Pick the budget in EPOCHS first
  # (steps = epochs * len(train_pairs) / optim.batch_size) and set num_train_steps from it.
  schedule: cosine
  cosine:
    # Floor of the cosine decay, as a fraction of each group's lr. 0.0 anneals to exactly zero
    # (the plan's schedule, and the measured default). A small floor (0.02-0.05) keeps the last
    # few hundred steps doing something; it is a knob, not a recommendation, and changing it in
    # the same run as anything else makes the result unattributable.
    min_factor: 0.0
  one_cycle:
    # 0.2 of 20K steps peaks at 4,000: 1,000 steps after flow.warmup_steps hands LoRA its
    # velocity gradients, so the features settle before the LR is hottest. Keep the peak after
    # that gate if either number moves.
    pct_start: 0.2
    div_factor: 25.0        # the ramp starts at lr / 25
    final_div_factor: 1.0e4 # the anneal ends at lr / 10,000
    cycle_momentum: true    # beta1 max -> min -> max, opposite the LR
    max_beta1: 0.95
    min_beta1: 0.85

# Dataloader.
loader:
  num_workers: 4          # PNG decode and flips run on CPU workers
  pin_memory: true
  val_batch_size: 4       # validation runs at the full input resolution: keep it small

# Logging.
logging:
  wandb_project: dawn     # stage 1. Stage 2 (the refiner) logs to dawn-refiner, same entity.
  # The W&B team or user the run belongs to. `null` (or no key at all) omits the entity from
  # wandb.init entirely and the account's own default is used, so a collaborator without access
  # to this one can still run. The project and entity actually used are logged at INFO on init.
  wandb_entity: my-team
  wandb_mode: online      # online | offline | disabled
  log_every: 100
  log_attn_gates: true    # log each block's learned DINO-attention gate every log_every steps
  # wandb.watch: weight and gradient histograms, through hooks on the parameters. wandb.watch
  # takes whole MODULES, so watching the encoder means hooking all 29M frozen DINO parameters
  # for the sake of the ~0.5M LoRA ones inside it: use `all` to debug LoRA, not for a real run.
  #   none | velocity | all     (all = velocity + encoder + colour head)
  watch_scope: velocity
  watch_freq: 500         # throttles the LOGGING; the hooks fire on every backward either way
  save_every: 5000
  # 20,000 / 500 = 40 validation points. At 2,500 a run produced EIGHT, which is not the
  # resolution needed to see a divergence begin on 3,662 pairs over ~87 epochs. Raise it only
  # after the gpu_probe has given you seconds/step: validation should stay a few percent of
  # wall-clock (docs/training_budget_and_changes.md section 1a).
  val_every: 500
  num_val_samples: 64     # val pairs per subset (box-aligned, fallback) per validation
  # Batches of the TRAINING objective on held-out pairs, at every validation. `validate` scores
  # sampled image quality; this is the loss itself, and a train curve falling while this one
  # turns up is the memorization signal nothing else in the run reports. null = every val batch.
  val_loss_batches: 8
  # Patch retrieval: does each adapted thermal token's nearest frozen RGB token turn out to be
  # its own? The evidence for or against a contrastive L_align (docs/proposals_review.md 4.1).
  # Costs one extra frozen DINO pass per validation batch.
  val_retrieval: true
  # Which validation number picks flow_best.pt, on the `pairs.eval_subset` subset:
  #   ciede2000  the full Lab difference: brightness AND colour. The default.
  #   psnr_L     L* only. L* comes mostly from the brightness grid fitted on thermal, the half
  #              of the model least able to memorize, so it is blind to colour going wrong.
  select_metric: ciede2000
  # Every metric that goes to W&B is also written locally, so the plots can be rebuilt without
  # it: train_log.jsonl (one object per line, the full record) and metrics/<kind>.csv per kind.
  metrics_csv: true
