# Stage 1: Flow model training configuration.
# Layouts and conventions: docs/conventions.md

# How the loss code treats the two kinds of aligned pairs (docs/conventions.md section 10.2).
# NOTHING READS THESE KEYS YET: the trainer is parked old-regime code, and the rest of this file is
# rewritten in the flow phase. They record the decided policy so the rewrite starts from it.
#   box-aligned pairs   aligned from the vehicle boxes; they have a `moving` mask.
#   fallback pairs      aligned by edge correlation only (data/manifests/fallback_pairs.txt); no
#                       `moving` mask, so the `vehicles` mask (every vehicle, dilated) stands in.
pairs:
  fallback_pixel_mask: vehicles     # fallback pairs: mask vehicles in L_flow targets and L_render
  box_pixel_mask: moving            # box-aligned pairs: mask only vehicles that moved
  fallback_render_weight: 0.5       # fallback pairs count half in L_render
  eval_subset: box_aligned          # model selection and headline test metrics on box-aligned only
  report_fallback_separately: true  # fallback val/test reported as a separate robustness number

# Grid specification.
grid:
  spatial_size: 16       # 16x16 spatial cells
  num_bins: 8            # brightness bins
  coeffs_per_bin: 12     # 3x3 matrix (row-major) + 3 offsets, see docs/conventions.md section 2.2
  # Ridge regularization for grid fitting.
  ridge_alpha: 1.0e-3
  # Normalization stats are computed once and cached.
  stats_cache: data/grid_stats.pt
  stats_num_samples: 2000

# Encoder: DINOv3 ViT-S+/16 with peft LoRA. One interface, two backends (dawn/models/encoder.py).
encoder:
  backend: timm            # timm | transformers
  model_ids:
    timm: vit_small_plus_patch16_dinov3.lvd1689m                 # needs timm>=1.0.20
    transformers: facebook/dinov3-vits16plus-pretrain-lvd1689m   # gated; needs the `transformers` extra
  patch_size: 16
  input_size: 256          # 256 / 16 = 16x16 patch tokens, matching grid.spatial_size
  num_register_tokens: 4   # patch tokens start after CLS + registers (index 1 + 4)
  pretrained: true         # false gives a randomly initialized backbone (offline debug runs)
  grad_checkpointing: false  # recompute DINO blocks in the backward pass (16 GB card)
  lora_rank: 8
  lora_alpha: 16
  lora_dropout: 0.0
  lora_lr: 1.0e-4
  # peft target_modules per backend: attention qkv + output projection of every block.
  # A string is a regex (full match), a list matches module-name suffixes. The timm regex keeps
  # patch_embed.proj out. Verify the matched names with scripts/smoke_dino.py.
  lora_targets:
    timm: '.*blocks\.\d+\.attn\.(qkv|proj)'
    transformers: [q_proj, k_proj, v_proj, o_proj]

# Velocity transformer.
velocity:
  hidden_dim: 256
  num_heads: 4
  num_blocks: 6
  mlp_ratio: 4
  dropout: 0.0
  # Attention bias from DINO patch-to-patch attention.
  dino_attn_gate_init: 0.0  # learned per block, init at 0
  detach_dino_attn: true    # no gradient into the encoder through the attention bias

# Flow matching.
flow:
  num_train_steps: 40000    # 30-50K on the 16 GB card (the original plan said 100K)
  num_inference_steps: 2    # NFE at inference
  timesteps_per_image: 4    # t samples per image per step: one encoder pass feeds 4 velocity passes
  # Loss weights.
  velocity_weight: 1.0      # L_flow
  apply_weight: 0.1         # L_render: L1(applied grid, day image)
  noise_weight: 1.0         # L_noise: MSE on (log a, log b)
  align_weight: 0.5         # L_align: adapted vs frozen (adapters disabled) DINO features
  # Bin-count weighting: scale loss per bin by pixel count.
  bin_count_weighting: true
  # The "5K-step schedule": until this step the encoder's patch tokens and CLS are DETACHED
  # before the velocity net and the noise head, so LoRA is trained by L_align alone. After it,
  # everything trains jointly. This is not the optimizer's LR warmup (optim.lr_warmup_steps).
  warmup_steps: 5000
  # Render loss on a random subset of the batch_size x timesteps_per_image samples. null = all.
  # Only a VRAM valve: 128 renders at 256^2 cost about 0.6 GB of activations.
  render_subset: null

# Optimization.
optim:
  optimizer: adamw
  lr: 2.0e-4
  weight_decay: 0.01      # not applied to norms, biases, attention gates or the pos embedding
  betas: [0.9, 0.999]
  batch_size: 32          # images per step (16 GB card); x flow.timesteps_per_image velocity samples each
  grad_clip: 1.0
  precision: bf16         # bf16 | fp32
  ema_decay: 0.999
  lr_warmup_steps: 1000   # linear LR warmup, then cosine decay over flow.num_train_steps

# Dataloader.
loader:
  num_workers: 4          # workers run dawn/data/degrade.py on the CPU
  pin_memory: true
  val_level: medium       # fixed val set darkness (dawn/data/degrade.py: DARKNESS_LEVELS)
  # Debug escape hatch: train on N procedurally generated images (dawn/flow/dataset.py:
  # SyntheticDay) instead of a manifest, so the loop runs with no VisDrone on disk.
  synthetic_images: null

# Logging.
logging:
  wandb_project: dawn
  wandb_mode: online      # online | offline | disabled
  log_every: 100
  log_attn_gates: true    # log each block's learned DINO-attention gate every log_every steps
  save_every: 5000
  val_every: 5000
  num_val_samples: 64
