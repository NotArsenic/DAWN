# Ablation: the plan's literal schedule, with both 2026-10-08 smoothings off.
#
#   --override configs/gpu_5090.yaml configs/abl_plain_schedule.yaml
#
# This is the CONTROL for the two changes in docs/training_budget_and_changes.md section 1b, so
# it deliberately moves two keys at once: together they are one question ("did the smoothings
# help?"), and each is a strict generalization whose off value reproduces the old behaviour
# exactly, so this run is the plan's schedule as written.
#   ema_warmup        false -> a fixed 0.999, whose shadow is 61% initialization at step 500
#   warmup_ramp_steps 0     -> the detach gate flips in one step instead of easing in over 500

optim:
  ema_warmup: false

flow:
  warmup_ramp_steps: 0
